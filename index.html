<style>
  :root{
    --paper:#F6F2E9; --card:#FFFFFF; --ink:#22261F; --muted:#6A6D63; --line:#E6E0D2;
    --green:#2E7D5B; --green-bg:#D6EADD;
    --pink:#C2577A;  --pink-bg:#F5D7E0;
    --blue:#2F6497;  --blue-bg:#D3DFF0;
    --olive:#5F5B26; --olive-bg:#E5E3C9;
    --radius:22px;
    --shadow:0 1px 2px rgba(34,38,31,.04), 0 8px 28px rgba(34,38,31,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#16181A; --card:#1F2225; --ink:#EEEBE3; --muted:#A3A39A; --line:#2E3236;
      --green:#6FC39C; --green-bg:#1F3329; --pink:#E58AA8; --pink-bg:#3A2330;
      --blue:#86AEE0;  --blue-bg:#1E2B3D; --olive:#C9C27A; --olive-bg:#2E2D1C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Zen Maru Gothic",system-ui,-apple-system,"Hiragino Sans",sans-serif;
    line-height:1.65; min-height:100vh; overflow-x:hidden;
    background-image:radial-gradient(var(--line) 1px, transparent 1px);
    background-size:22px 22px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}

  /* ---------- top bar ---------- */
  .bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 4px}
  .brand{font-family:Fraunces,serif;font-weight:700;font-size:20px;letter-spacing:.06em}
  .lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
  .lang button{border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--muted);
    padding:6px 12px;border-radius:999px;cursor:pointer;transition:.2s}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  /* ---------- hero ---------- */
  .hero{text-align:center;padding:18px 0 8px}
  .clover{width:200px;height:200px;margin:0 auto 6px;display:block}
  .clover g.spin{transform-origin:100px 100px;animation:spin 40s linear infinite}
  .clover circle{mix-blend-mode:multiply;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .clover circle{mix-blend-mode:screen;opacity:.75} }
  .clover:hover circle.c1{transform:translate(-6px,-6px)}
  .clover:hover circle.c2{transform:translate(6px,-6px)}
  .clover:hover circle.c3{transform:translate(-6px,6px)}
  .clover:hover circle.c4{transform:translate(6px,6px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero h1{font-size:clamp(26px,7vw,34px);font-weight:900;line-height:1.3;letter-spacing:.01em}
  .hero h1 em{font-style:normal;background:linear-gradient(transparent 62%, var(--green-bg) 62%)}
  .hero p{color:var(--muted);margin-top:8px;font-size:15px}

  /* ---------- finder ---------- */
  .finder{margin:26px 0 18px}
  .finder h2{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{border:1.5px solid var(--c);color:var(--c);background:var(--card);font:inherit;font-size:14px;font-weight:700;
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:transform .15s, background .2s}
  .chip:active{transform:scale(.96)}
  .chip:hover{background:var(--cbg)}

  /* ---------- cards ---------- */
  .cards{display:grid;gap:14px;margin-top:8px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line);overflow:hidden;position:relative;
    opacity:0;transform:translateY(18px);transition:opacity .6s, transform .6s, box-shadow .3s}
  .card.in{opacity:1;transform:none}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
  .card.pulse{animation:pulse 1.2s ease-out 1}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 14px transparent}}
  .head{display:flex;gap:14px;align-items:center;padding:18px 18px 4px 22px;cursor:pointer;width:100%;
    background:none;border:0;text-align:left;font:inherit;color:inherit}
  .icon{flex:0 0 64px;height:64px;border-radius:50%;background:var(--cbg);display:grid;place-items:center}
  .icon svg{width:40px;height:40px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .titles{flex:1;min-width:0}
  .num{font-family:Fraunces,serif;font-size:12px;color:var(--c);font-weight:700;letter-spacing:.1em}
  .titles h3{font-size:21px;font-weight:900;color:var(--c);line-height:1.25}
  .titles .sub{font-size:13px;color:var(--muted);font-weight:500}
  .toggle{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
    color:var(--muted);transition:transform .3s;flex:0 0 30px}
  .card.open .toggle{transform:rotate(45deg);border-color:var(--c);color:var(--c)}
  .desc{padding:8px 18px 0 22px;font-size:15px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 16px 22px}
  .tag{font-size:12px;font-weight:700;background:var(--cbg);color:var(--c);padding:4px 10px;border-radius:999px}
  .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  .card.open .more{grid-template-rows:1fr}
  .more>div{overflow:hidden}
  .more ul{list-style:none;padding:0 18px 4px 22px;display:grid;gap:6px;font-size:14px}
  .more li{display:flex;gap:8px}
  .more li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--c);margin-top:9px}
  .cta{display:flex;gap:8px;padding:14px 18px 18px 22px;flex-wrap:wrap}
  .btn{flex:1;min-width:130px;text-align:center;text-decoration:none;font-weight:700;font-size:15px;
    padding:12px 16px;border-radius:14px;transition:transform .15s, filter .2s}
  .btn:active{transform:scale(.97)}
  .btn.solid{background:var(--c);color:#fff}
  .btn.ghost{border:1.5px solid var(--c);color:var(--c)}
  .btn:hover{filter:brightness(1.07)}

  .en{--c:var(--green);--cbg:var(--green-bg)}
  .ja{--c:var(--pink);--cbg:var(--pink-bg)}
  .tn{--c:var(--blue);--cbg:var(--blue-bg)}
  .ag{--c:var(--olive);--cbg:var(--olive-bg)}

  /* ---------- footer ---------- */
  .connect{margin-top:30px;text-align:center}
  .connect h2{font-size:18px;font-weight:900}
  .connect p{color:var(--muted);font-size:14px;margin-top:4px}
  .socials{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .social{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);
    border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
  .social svg{width:18px;height:18px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--ink);color:var(--paper);
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;transition:transform .3s,opacity .3s;z-index:9;opacity:0;pointer-events:none}
  .toast.show{transform:translate(-50%,0);opacity:1}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>

    join:"Join", info:"Learn more", match:"Get matched",
    connectTitle:"Let's stay connected", connectSub:"Schedules and updates are posted on our socials",
    share:"Share", copied:"Link copied"
  }
};

/* ---------- language ---------- */
function setLang(l){
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v=T[l][el.dataset.i18n]; if(v!==undefined) el.innerHTML=v; });
  document.querySelectorAll("[data-set-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.setLang===l));
  try{ localStorage.setItem("lang", l); }catch(e){}
}
let saved=null; try{ saved=localStorage.getItem("lang"); }catch(e){}
setLang(saved || ((navigator.language||"").startsWith("ja") ? "ja" : "en"));
document.querySelectorAll("[data-set-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.setLang)));

/* ---------- links ---------- */
document.querySelectorAll("[data-link]").forEach(a=>{
  const [k1,k2]=a.dataset.link.split("."); const url=LINKS[k1]?.[k2];
  if(url){ a.href=url; if(!url.startsWith("mailto:")){ a.target="_blank"; a.rel="noopener"; } }
});

/* ---------- expand cards ---------- */
function toggle(card, force){
  const open = force ?? !card.classList.contains("open");
  card.classList.toggle("open", open);
  card.querySelector(".head").setAttribute("aria-expanded", open);
}
document.querySelectorAll(".card .head").forEach(h=>h.addEventListener("click",()=>toggle(h.closest(".card"))));

/* ---------- finder chips ---------- */
document.querySelectorAll("[data-go]").forEach(c=>c.addEventListener("click",()=>{
  const card=document.getElementById(c.dataset.go);
  card.scrollIntoView({behavior:"smooth",block:"center"});
  toggle(card,true);
  card.classList.remove("pulse"); void card.offsetWidth; card.classList.add("pulse");
}));

/* ---------- reveal on scroll ---------- */
const io=new IntersectionObserver(es=>es.forEach((e,i)=>{ if(e.isIntersecting){ setTimeout(()=>e.target.classList.add("in"), i*90); io.unobserve(e.target);} }),{threshold:.15});
document.querySelectorAll(".card").forEach(c=>io.observe(c));

/* ---------- share ---------- */
const toast=document.getElementById("toast");
document.getElementById("share").addEventListener("click", async ()=>{
  const url=location.href;
  try{
    if(navigator.share){ await navigator.share({title:document.title,url}); return; }
    await navigator.clipboard.writeText(url);
    toast.textContent=T[document.documentElement.lang].copied; toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1800);
  }catch(e){}
});
document.getElementById("yr").textContent=new Date().getFullYear();
</script>
</body>
